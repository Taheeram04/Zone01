name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "Zone01web/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "Zone01web/backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: Zone01web/backend

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zone01
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/zone01

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            Zone01web/backend/requirements.txt
            Zone01web/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Test
        run: python manage.py test
