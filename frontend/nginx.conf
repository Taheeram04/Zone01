server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # Behind Fly's TLS proxy; absolute redirects would leak http:// and :8080.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets never change; cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The CMS (Django admin) lives on the API app, not in the SPA. Proxy it
    # (plus the static/filer/i18n paths its pages load) so the browser stays
    # on our own domain instead of being bounced to the fly.dev hostname.
    location = /admin {
        return 302 /admin/;
    }
    location ~ ^/(admin|static|media|filer|jsi18n)/ {
        proxy_pass https://zone01-kisumu-api.fly.dev;
        proxy_ssl_server_name on;
        proxy_set_header Host zone01-kisumu-api.fly.dev;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect https://zone01-kisumu-api.fly.dev/ /;
        client_max_body_size 25m;
    }

    # Client-side routing (BrowserRouter): unknown paths fall back to the app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
