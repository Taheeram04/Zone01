# fly.toml app configuration file generated for zone01-kisumu-api on 2026-10-07T00:16:10+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'zone01-kisumu-api'
primary_region = 'jnb'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'python manage.py migrate --noinput'

[env]
  API_CORS_ALLOWED_ORIGINS = 'https://zone01-kisumu-web.fly.dev'
  CSRF_TRUSTED_ORIGINS = 'https://zone01-kisumu-api.fly.dev'
  DJANGO_ALLOWED_HOSTS = 'zone01-kisumu-api.fly.dev'
  DJANGO_DEBUG = 'false'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
