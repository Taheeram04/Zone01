services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zone01
    ports:
      - "5432:5432"
    volumes:
      - zone01_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zone01"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  zone01_pgdata:
