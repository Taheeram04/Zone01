# fly.toml app configuration file generated for zone01-kisumu-api on 2026-10-07T00:16:10+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'zone01-kisumu-api'
primary_region = 'jnb'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'python manage.py migrate --noinput && python manage.py ensure_public_media && python manage.py seed_report_files'

[env]
  # Every public frontend origin that calls /api/ must be listed here, otherwise
  # the browser blocks CMS content and images with a CORS error.
  API_CORS_ALLOWED_ORIGINS = 'https://zone01-kisumu-web.fly.dev,https://zone01kisumu.ke,https://www.zone01kisumu.ke'
  CSRF_TRUSTED_ORIGINS = 'https://zone01-kisumu-api.fly.dev,https://zone01kisumu.ke,https://www.zone01kisumu.ke'
  DJANGO_ALLOWED_HOSTS = 'zone01-kisumu-api.fly.dev,zone01kisumu.ke,www.zone01kisumu.ke'
  DJANGO_DEBUG = 'false'
  FRONTEND_URL = 'https://www.zone01kisumu.ke'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'
    # Django's ALLOWED_HOSTS rejects the machine IP Fly's checker sends as Host.
    headers = { Host = 'zone01-kisumu-api.fly.dev' }

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
